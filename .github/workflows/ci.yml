name: ci
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Install (no torch; torch-dependent tests skip)
        run: pip install -e '.[dev]'
      - name: Ruff
        run: ruff check .
      - name: Pytest
        run: pytest -q
  test-torch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip
      - name: Install (CPU torch extra)
        run: pip install -e '.[dev,torch,convert]' --extra-index-url https://download.pytorch.org/whl/cpu
      - name: Pytest (ViT tests run; any skip fails)
        env:
          REQUIRE_TORCH: "1"
        run: pytest -q -rs
