# Small ViT trained from scratch (vit_train_from_scratch_10gest.ipynb). Merge: base < this < task.
test_size: 0.2
val_size: 0.2
device: auto
model:
  hidden_size: 128
  num_attention_heads: 4
  num_hidden_layers: 4
  image_size: 224
  input_repr: flatten  # flatten (truncating, legacy) | spectrogram (STFT of the full window)
  spectrogram:         # used only when input_repr: spectrogram
    nperseg: 32
    noverlap: null     # null = nperseg // 2
    log: true          # log1p of the STFT magnitude
  patch_size: 8
  hidden_dropout_prob: 0.3
  attention_probs_dropout_prob: 0.3
train:
  epochs: 500
  batch_size: 256
  lr: 1.0e-4
  weight_decay: 1.0e-4
  eps: 1.0e-6        # transformers.AdamW default used by the notebook
  grad_clip: 1.0
  num_workers: 0
  # Schedule is stepped once per BATCH.
  # Default (legacy_epoch_units: false): real optimiser steps. total = epochs * len(train_loader),
  #   warmup = warmup_epochs * len(train_loader); max_epochs is ignored. The floor is eta_min_ratio * lr
  #   (if set) else eta_min (absolute), default 0.0 as in the notebook formula.
  # legacy_epoch_units: true reproduces the thesis runs: the notebooks counted warmup_epochs/max_epochs as
  #   optimiser STEPS, so with many batches per epoch the cosine finished after max_epochs steps (a few
  #   epochs) and the LR then sat at eta_min (the step is clamped). Uses max_epochs as given.
  # Set scheduler: null to disable.
  scheduler:
    name: warmup_cosine
    legacy_epoch_units: false
    warmup_epochs: 5
    max_epochs: 500     # only used when legacy_epoch_units: true
    eta_min: 0.0
    eta_min_ratio: null  # floor as a fraction of lr; overrides eta_min when set
augment:
  enabled: true
  noise_factor: 0.05
  scale_factor: 0.1
tracking:
  enabled: false
  uri: null
  experiment: null
