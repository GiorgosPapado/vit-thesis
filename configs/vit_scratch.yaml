# Small ViT trained from scratch (vit_train_from_scratch_10gest.ipynb). Merge: base < this < task.
test_size: 0.2
val_size: 0.2
device: auto
model:
  hidden_size: 128
  num_attention_heads: 4
  num_hidden_layers: 4
  image_size: 224
  patch_size: 8
  hidden_dropout_prob: 0.3
  attention_probs_dropout_prob: 0.3
train:
  epochs: 500
  batch_size: 256
  lr: 1.0e-4
  weight_decay: 1.0e-4
  eps: 1.0e-6        # transformers.AdamW default used by the notebook
  grad_clip: 1.0
  num_workers: 0
  # The notebooks called scheduler.step() once per BATCH but counted warmup_epochs/max_epochs as if per epoch,
  # i.e. epochs were treated as optimiser steps. Kept as-is inside max_epochs (units are optimiser steps);
  # beyond max_epochs steps the step is CLAMPED and the LR stays at eta_min. With many batches per epoch the
  # schedule therefore ends early (e.g. 500 steps = a few epochs). Set scheduler: null to disable.
  scheduler:
    name: warmup_cosine
    warmup_epochs: 5
    max_epochs: 500
    eta_min: 0.0
augment:
  enabled: true
  noise_factor: 0.05
  scale_factor: 0.1
tracking:
  enabled: false
  uri: null
  experiment: null
