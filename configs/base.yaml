# Settings shared by all methods and tasks. Merge order: base < method (svm.yaml) < task.
seed: 42
split: grouped        # grouped (participant-disjoint) | random (per-file) | session (cross-session, thesis protocol); *part tasks force random from grouped
train_sessions: [1, 2]  # split: session only; files need a session<k> filename token
test_sessions: [3]      # split: session only; test_size is ignored, val_size is carved from the train sessions
test_size: 0.33
cv_splits: 3
stratify: true       # random split only: stratify by label when every class has >= 2 members, else fall back (warning)
deterministic: false # opt-in torch deterministic algorithms (best effort, may be slower); see README
target_length: 10240
data_dir: null        # set per task (relative to the working directory) or via --set data_dir=...
